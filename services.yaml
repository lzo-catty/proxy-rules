# 按此顺序匹配服务；name 是手机端显示的策略组名称。
# default 可选 DIRECT 或 Global；手机端可为每组单独选择其他节点。
- id: bilibili
  name: Bilibili
  geosite: bilibili
  default: DIRECT
  icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/bilibili.png
- id: telegram
  name: Telegram
  geosite: telegram
  geoip: telegram
  default: Global
  icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png
