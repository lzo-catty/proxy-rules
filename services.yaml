- id: telegram
  name: Telegram
  geosite: telegram
  geoip: telegram
  default: Global
- id: apple
  name: Apple
  geosite: apple
  default: DIRECT
- id: microsoft
  name: Microsoft
  geosite: microsoft
  default: DIRECT
- id: google
  name: Google
  geosite: google
  default: Global
